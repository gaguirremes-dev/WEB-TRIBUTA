    <path d="M450 318 L228 108"/>
    <path d="M450 318 L452 486"/>
    <path d="M450 318 L642 512"/>
    <path d="M450 318 L678 356"/>
    <path d="M300 176 L228 108"/>
    <path d="M452 486 L642 512"/>
  </g>

