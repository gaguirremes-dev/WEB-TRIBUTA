<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="Mapa de cobertura nacional de la red Tributa">
  <defs>
    <linearGradient id="cn-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D94F40"/>
      <stop offset="1" stop-color="#A02E22"/>
    </linearGradient>
    <radialGradient id="cn-hub" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#C13A2C" stop-opacity=".26"/>
      <stop offset="1" stop-color="#C13A2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cn-warm" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#1B3D6B" stop-opacity=".16"/>
      <stop offset="1" stop-color="#1B3D6B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cn-grid" width="45" height="45" patternUnits="userSpaceOnUse">
