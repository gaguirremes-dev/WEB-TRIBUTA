    </pattern>
    <style>
      .cn-lbl { font-family: 'Poppins','Inter',system-ui,sans-serif; font-size: 16px; font-weight: 600; fill: #48566B; }
      .cn-sub { font-family: 'Inter',system-ui,sans-serif; font-size: 12px; font-weight: 500; fill: #8A99AE; }
      .cn-hublbl { font-family: 'Poppins','Inter',system-ui,sans-serif; font-size: 15px; font-weight: 700; fill: #0F2444; }
    </style>
  </defs>

  <rect width="900" height="640" fill="url(#cn-grid)"/>
  <rect x="0" y="0" width="900" height="640" fill="url(#cn-warm)"/>
  <circle cx="450" cy="318" r="250" fill="url(#cn-hub)"/>

  <g stroke="#1B3D6B" stroke-opacity=".28" stroke-width="1.6" stroke-dasharray="6 7" fill="none">
